name: CI

on:
  push:
    branches: [main, codex/foundation-hardening]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      # Base de test reconstruite à l'identique de la production (test/integration)
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      JWT_SECRET: ci-only-secret-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # Résumé lisible depuis l'API GitHub (annotation) : tests sur la vraie base bien exécutés, pas ignorés.
      - name: Résumé des tests sur base réelle
        if: always()
        run: |
          node --test test/integration/*.test.js > integration.log 2>&1 || true
          echo "::notice title=Tests base réelle::$(grep -E '^# (tests|pass|fail|skipped)' integration.log | tr '\n' ' ')"
          # Échecs lisibles sans accès aux journaux : nom du test et premières lignes de l'erreur.
          fails=$(grep -E "^\s*not ok|^\s+(error|expected|actual|message|code):|failureType" integration.log | grep -v "failureType: 'subtestsFailed'" | head -60 | tr '\n' ' ' | cut -c1-4000)
          if [ -n "$fails" ]; then echo "::warning title=Échecs base réelle::$fails"; fi
